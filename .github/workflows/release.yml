name: Release

# Publishes a GitHub release with the signed APK for the version in
# pubspec.yaml. Runs on every push to main and does nothing once that
# version's release exists, so bumping `version:` in pubspec.yaml is what
# ships a new release. Pushed vX.Y.Z tags and manual runs work too.
# See "Releases" in docs/android-release.md.
#
# The APK is signed with the release key from the HEXRIS_KEYSTORE_BASE64,
# HEXRIS_KEYSTORE_PASSWORD, HEXRIS_KEY_ALIAS and HEXRIS_KEY_PASSWORD secrets
# (created with tool/create_release_keystore.sh). Without them the workflow
# fails instead of publishing an APK that later releases could not update.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Version from pubspec.yaml
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)
          code=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml"
            exit 1
          fi
          published=$(gh release view "$tag" --json isDraft -q '.isDraft | not' 2>/dev/null || echo false)
          if [ "$published" = true ]; then
            echo "$tag is already released; bump the version in pubspec.yaml to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$changelog" ]; then
            echo "::error::Missing $changelog for versionCode $code"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "VERSION_CODE=$code"
            echo "CHANGELOG=$changelog"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Release keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HEXRIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEXRIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEXRIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEXRIS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing key not configured. Run tool/create_release_keystore.sh (see docs/android-release.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          # Fail early on a wrong password or alias, before a 10-minute build.
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Toolchain (tool/setup_android_env.sh)
        if: steps.version.outputs.skip != 'true'
        env:
          SKIP_EMULATOR: "1"
        run: |
          tool/setup_android_env.sh
          source "$HOME/.hexris-android-env"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: flutter pub get, analyze, test
        if: steps.version.outputs.skip != 'true'
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: flutter build apk --release
        if: steps.version.outputs.skip != 'true'
        run: flutter build apk --release

      - name: Check the signed APK
        if: steps.version.outputs.skip != 'true'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          badging=$(aapt2 dump badging "$APK")
          echo "$badging" | head -4
          echo "$badging" | grep -q "package: name='com.hexris.hexris' versionCode='$VERSION_CODE' versionName='$VERSION'"
          echo "$badging" | grep -qE "(minSdkVersion|sdkVersion):'31'"
          echo "$badging" | grep -q "targetSdkVersion:'36'"
          ! unzip -l "$APK" | grep -qiE 'META-INF/.*DEPENDENC'
          ! apkanalyzer dex packages "$APK" | awk '{print $NF}' \
              | grep -qE '^com\.google\.android\.(gms|play)'

          # Signed with the release key, not a debug or other key.
          certs=$(apksigner verify --verbose --print-certs "$APK")
          echo "$certs"
          echo "$certs" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          apk_cert=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          key_cert=$(keytool -exportcert -keystore android/app/release.jks \
              -storepass "$(sed -n 's/^storePassword=//p' android/key.properties)" \
              -alias "$(sed -n 's/^keyAlias=//p' android/key.properties)" \
            | openssl dgst -sha256 -r | cut -d' ' -f1)
          if [ "$apk_cert" != "$key_cert" ]; then
            echo "::error::APK certificate $apk_cert is not the release key's $key_cert"
            exit 1
          fi
          echo "CERT_SHA256=$(echo "$apk_cert" | tr a-f A-F | sed 's/../&:/g; s/:$//')" >> "$GITHUB_ENV"

          mkdir dist
          cp "$APK" "dist/hexris-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            cat "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "Install \`hexris-$VERSION.apk\` on Android 12 or newer (phones and tablets)."
            echo "versionCode $VERSION_CODE."
            echo
            echo "Signing certificate SHA-256 (check with \`apksigner verify --print-certs\`):"
            echo
            echo "\`$CERT_SHA256\`"
            echo
            echo "File checksums are in \`SHA256SUMS\`."
          } > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A draft from an earlier workflow version: replace its assets
            # and publish it.
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Hexris $VERSION" \
              --notes-file notes.md --draft=false --latest
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" dist/* --verify-tag --latest \
              --title "Hexris $VERSION" --notes-file notes.md
          else
            # Creates the vX.Y.Z tag on this commit.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --latest \
              --title "Hexris $VERSION" --notes-file notes.md
          fi
          gh release view "$TAG" --json url -q .url

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.skip != 'true'
        with:
          name: release-apk
          path: dist/
