name: Release

# Builds the release APK for a vX.Y.Z tag and attaches it to a *draft* GitHub
# release, which is reviewed and published by hand. See "Releases" in
# docs/android-release.md.
#
# Signing: if the HEXRIS_KEYSTORE_BASE64, HEXRIS_KEYSTORE_PASSWORD,
# HEXRIS_KEY_ALIAS and HEXRIS_KEY_PASSWORD secrets are set, the APK is signed
# with that release key. Otherwise the release gets the unsigned APK (what
# F-Droid builds and signs itself) plus a copy signed with a throwaway key
# for testing, which cannot be updated in place by later releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.9

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check the tag against pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)
          code=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml"
            exit 1
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$changelog" ]; then
            echo "::error::Missing $changelog for versionCode $code"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "CHANGELOG=$changelog" >> "$GITHUB_ENV"

      - name: Toolchain (tool/setup_android_env.sh)
        env:
          SKIP_EMULATOR: "1"
        run: |
          tool/setup_android_env.sh
          source "$HOME/.hexris-android-env"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: flutter pub get, analyze, test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.HEXRIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEXRIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEXRIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEXRIS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret: building unsigned."
            echo "SIGNING=none" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "SIGNING=release" >> "$GITHUB_ENV"

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Check and collect the APKs
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          badging=$(aapt2 dump badging "$APK")
          echo "$badging" | head -4
          echo "$badging" | grep -q "package: name='com.hexris.hexris' versionCode='$VERSION_CODE' versionName='$VERSION'"
          echo "$badging" | grep -qE "(minSdkVersion|sdkVersion):'31'"
          echo "$badging" | grep -q "targetSdkVersion:'36'"
          ! unzip -l "$APK" | grep -qiE 'META-INF/.*DEPENDENC'
          ! apkanalyzer dex packages "$APK" | awk '{print $NF}' \
              | grep -qE '^com\.google\.android\.(gms|play)'

          mkdir dist
          if [ "$SIGNING" = release ]; then
            apksigner verify --print-certs "$APK"
            cp "$APK" "dist/hexris-$VERSION.apk"
          else
            cp "$APK" "dist/hexris-$VERSION-unsigned.apk"
            keytool -genkeypair -keystore test.jks -storepass android -keypass android \
              -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Hexris test build"
            zipalign -p -f 4 "$APK" aligned.apk
            apksigner sign --ks test.jks --ks-pass pass:android \
              --out "dist/hexris-$VERSION-test-signed.apk" aligned.apk
            apksigner verify "dist/hexris-$VERSION-test-signed.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Release notes
        run: |
          {
            cat "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "Android 12 or newer, phones and tablets. versionCode $VERSION_CODE."
            echo
            if [ "$SIGNING" = release ]; then
              echo "\`hexris-$VERSION.apk\` is signed with the release key."
            else
              echo "No release key was configured for this build:"
              echo
              echo "- \`hexris-$VERSION-test-signed.apk\` installs directly, but is signed with a"
              echo "  throwaway key. A later release signed with another key cannot update it;"
              echo "  uninstall it first (this deletes the saved game and high scores)."
              echo "- \`hexris-$VERSION-unsigned.apk\` is the unsigned build, as F-Droid builds it."
            fi
            echo
            echo "Checksums are in \`SHA256SUMS\`."
          } > notes.md
          cat notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "Hexris $VERSION" --notes-file notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/
